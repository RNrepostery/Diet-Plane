<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
        </filter>
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
    </defs>
    
    <g transform="translate(48, 48)" filter="url(#shadow)">
        <!-- Medical Shield Base -->
        <path d="M 180 30 C 260 30, 320 60, 320 120 C 320 220, 240 290, 180 330 C 120 290, 40 220, 40 120 C 40 60, 100 30, 180 30 Z" 
              fill="#ffffff" />
        
        <!-- Inner Medical Cross / Nutrition Hybrid -->
        <path d="M 160 85 L 200 85 L 200 145 L 260 145 L 260 185 L 200 185 L 200 245 L 160 245 L 160 185 L 100 185 L 100 145 L 160 145 Z" 
              fill="#0d9488" />
              
        <!-- Heart Pulse Line across Cross -->
        <path d="M 85 165 L 135 165 L 155 125 L 175 205 L 195 135 L 210 180 L 225 165 L 275 165" 
              fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Nutrition Sprout Leaf -->
        <path d="M 220 85 C 255 70, 280 90, 275 120 C 250 125, 230 110, 220 85 Z" 
              fill="url(#leafGrad)" />
        <path d="M 220 85 Q 250 100 275 120" 
              fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
</svg>