<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clinical Dietetics & Nutrition Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- App CSS -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d9488'/><path d='M35 50h30M50 35v30' stroke='white' stroke-width='12' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar no-print" id="appSidebar">
        <div class="brand-section">
            <div class="brand-logo">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <div>
                <div class="brand-title">Clinical Dietetics</div>
                <div class="brand-subtitle">Diet & Nutrition System</div>
            </div>
        </div>

        <nav class="nav-menu">
            <button class="nav-item active" data-view="dashboard" onclick="navigateTo('dashboard')">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Clinical Dashboard</span>
            </button>
            <button class="nav-item" data-view="patient-intake" onclick="navigateTo('patient-intake')">
                <i class="bi bi-person-plus-fill"></i>
                <span>Patient Intake</span>
            </button>
            <button class="nav-item" data-view="disease-master" onclick="navigateTo('disease-master')">
                <i class="bi bi-shield-shaded"></i>
                <span>Disease Master</span>
            </button>
            <button class="nav-item" data-view="master-items" onclick="navigateTo('master-items')">
                <i class="bi bi-database-fill-gear"></i>
                <span>Item Master (Foods)</span>
            </button>
            <button class="nav-item" data-view="diet-generator" onclick="navigateTo('diet-generator')">
                <i class="bi bi-journal-medical"></i>
                <span>Diet Plan Generator</span>
            </button>
            <button class="nav-item" data-view="diet-plans" onclick="navigateTo('diet-plans')">
                <i class="bi bi-file-earmark-medical-fill"></i>
                <span>Saved Diet Charts</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile-badge">
                <div style="display: flex; align-items: center; gap: 0.65rem;">
                    <div class="user-avatar">A</div>
                    <div>
                        <div style="font-weight: 700; font-size: 0.8rem; color: #fff;">Ashish</div>
                        <div style="font-size: 0.65rem; color: #2dd4bf; font-weight: 600;">Registered Dietitian</div>
                    </div>
                </div>
                <span class="badge" style="background: rgba(13,148,136,0.3); color: #2dd4bf; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;">Local-First</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <header class="top-header no-print">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem;">
                    <i class="bi bi-shield-check text-success"></i>
                    <span>Offline-First Medical Data Architecture</span>
                    <span class="badge" style="background: #e6fffa; color: #0d9488; font-weight: 700; font-size: 0.7rem; border: 1px solid #99f6e4;">Zero Cloud Dependency</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <a href="/phone" class="btn-emerald" style="font-size: 0.8rem; padding: 0.4rem 0.9rem; text-decoration: none;">
                    <i class="bi bi-phone-fill"></i> Phone UI Simulator
                </a>
                <button class="btn-outline-teal" style="font-size: 0.8rem; padding: 0.4rem 0.9rem;" onclick="exportDatabaseBackup()">
                    <i class="bi bi-download"></i> Backup JSON
                </button>
                <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
                    <i class="bi bi-calendar3 me-1"></i> <span id="headerCurrentDate"></span>
                </div>
            </div>
        </header>

        <main class="content-body" id="mainContent">
            <!-- Dynamic Views are rendered here -->
        </main>
    </div>
</div>

<!-- Modal Container for Dialogs -->
<div id="modalContainer"></div>

<!-- Core Engine Scripts -->
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
