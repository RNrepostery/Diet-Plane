<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Clinical Dietetics — Admin & Multi-User Nutrition</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="mobile.css" />
</head>
<body>

<div class="phone-viewport">
    <!-- Android Top Status Bar (Matching User's Screenshots: 3:19 PM, VoWiFi, Battery 24%) -->
    <div class="android-status-bar">
        <div class="status-left">
            <span id="mobileClock">3:19 PM</span>
            <i class="bi bi-envelope-fill" style="font-size: 0.65rem; opacity: 0.85;"></i>
        </div>
        <div class="status-right">
            <i class="bi bi-bluetooth"></i>
            <span style="font-size: 0.62rem; font-weight: 800; letter-spacing: -0.02em;">VoWiFi</span>
            <span style="font-size: 0.6rem; font-weight: 800;">R</span>
            <i class="bi bi-wifi"></i>
            <span class="battery-pill">
                <i class="bi bi-lightning-charge-fill" style="font-size: 0.55rem;"></i>
                <span>24</span>
            </span>
        </div>
    </div>

    <!-- App Role Selector Bar (Switch Between Admin & Multiple Users) -->
    <div class="role-selector-bar">
        <div class="role-toggle-pill">
            <button class="role-pill-btn active" id="btnRoleAdmin" onclick="setAppRole('admin')">
                <i class="bi bi-shield-lock-fill"></i> Admin Portal
            </button>
            <button class="role-pill-btn" id="btnRoleUser" onclick="setAppRole('user')">
                <i class="bi bi-people-fill"></i> Multiple Users
            </button>
        </div>
        <div id="userSelectorDropdownContainer" class="user-quick-dropdown" style="display: none;">
            <span style="color: var(--slate-500); font-size: 0.72rem; white-space: nowrap; margin-right: 6px;">
                <i class="bi bi-person-circle"></i> Active User:
            </span>
            <select id="activeUserSelect" onchange="onActiveUserChanged(this.value)">
                <!-- Populated dynamically: Rajesh, Pooja, Ananya, Vikram -->
            </select>
        </div>
    </div>

    <!-- Screen Navigation Header (Matching screenshot with back arrow, category title, progress bar) -->
    <header class="app-screen-header" id="appScreenHeader">
        <div class="header-main-row">
            <button class="header-nav-back" id="mobileBackBtn" onclick="handleMobileBack()">
                <i class="bi bi-arrow-left"></i>
            </button>
            <div class="header-category-title" id="mobileCategoryTitle">Basic Info</div>
            <div class="header-right-action" id="headerRightAction">
                <!-- Action / Reset / Shortcut -->
            </div>
        </div>
        <!-- Emerald Progress Bar (Matching screenshots) -->
        <div class="header-progress-track" id="headerProgressTrack">
            <div class="header-progress-fill" id="headerProgressFill" style="width: 45%;"></div>
        </div>
    </header>

    <!-- Main Content Area (Rendered by mobile.js) -->
    <main class="mobile-content-area" id="mobileCardSheet">
        <!-- Rendered based on active tab and role -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav">
        <!-- Rendered based on active role (Admin vs User) -->
    </nav>

    <!-- Android Bottom Navigation Bar (Matching Screenshots: Square, Circle, Triangle) -->
    <div class="android-nav-bar">
        <div class="android-nav-btn square"></div>
        <div class="android-nav-btn circle"></div>
        <div class="android-nav-btn triangle"></div>
    </div>
</div>

<!-- Modal Container for Meal Inspector / Edit User / Add User -->
<div id="mobileModalOverlay" class="mobile-modal-overlay" style="display: none;" onclick="closeMobileModal(event)">
    <div class="mobile-modal-sheet" id="mobileModalSheet" onclick="event.stopPropagation()">
        <!-- Dynamic modal content -->
    </div>
</div>

<!-- Toast notification element -->
<div id="mobileToast" class="mobile-toast"></div>

<!-- Core Engine Scripts -->
<script src="app.js"></script>
<script src="mobile.js"></script>
</body>
</html>
